<svg viewBox="0 0 680 350" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ε-N 定义的几何意义</title>
  <desc>只有有限项落在 a 的 ε 邻域之外，n 大于 N 之后所有项都进入邻域</desc>
  <text x="24" y="28" font-size="15" font-weight="500" fill="#1a1a1a" font-family="'Microsoft YaHei',sans-serif">图　ε-N 定义：只有有限项落在邻域之外</text>
  <line x1="24" y1="40" x2="656" y2="40" stroke="#e3dff0" stroke-width="1"/>

  <rect x="280" y="96" width="160" height="128" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <line x1="60" y1="160" x2="620" y2="160" stroke="#111" stroke-width="2"/>
  <polygon points="620,155 630,160 620,165" fill="#111"/>
  <line x1="280" y1="96" x2="280" y2="224" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="440" y1="96" x2="440" y2="224" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="360" y1="150" x2="360" y2="170" stroke="#534AB7" stroke-width="2"/>

  <g font-family="'Microsoft YaHei',sans-serif" font-size="12" fill="#3C3489" text-anchor="middle">
    <text x="280" y="242">a − ε</text>
    <text x="360" y="242">a</text>
    <text x="440" y="242">a + ε</text>
  </g>
  <g fill="#fff" stroke="#a32d2d" stroke-width="1.5">
    <circle cx="90" cy="130" r="5"/><circle cx="125" cy="192" r="5"/>
    <circle cx="165" cy="120" r="5"/><circle cx="205" cy="198" r="5"/>
    <circle cx="242" cy="135" r="5"/><circle cx="265" cy="185" r="5"/>
  </g>
  <g fill="#534AB7">
    <circle cx="305" cy="148" r="5"/><circle cx="330" cy="172" r="5"/>
    <circle cx="355" cy="152" r="5"/><circle cx="385" cy="168" r="5"/>
    <circle cx="410" cy="145" r="5"/><circle cx="428" cy="162" r="5"/>
  </g>
  <g font-family="'Microsoft YaHei',sans-serif" font-size="12">
    <text x="70" y="272" fill="#a32d2d">前 N 项（有限个，允许落在邻域外）</text>
    <text x="300" y="272" fill="#534AB7">n &gt; N 的项全部进入邻域</text>
  </g>

  <line x1="24" y1="292" x2="656" y2="292" stroke="#e3dff0" stroke-width="1"/>
  <text x="24" y="314" font-size="11" fill="#777" font-family="'Microsoft YaHei',sans-serif">先给 ε（决定邻域宽度），再找 N（决定从第几项起完全落入）；N 只依赖 ε，不依赖 n。</text>
  <text x="24" y="334" font-size="11" fill="#777" font-family="'Microsoft YaHei',sans-serif">空心红点＝有限个例外；实心紫点＝n &gt; N 之后的全部项。</text>
</svg>